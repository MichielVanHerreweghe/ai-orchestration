apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator
  namespace: orchestrator
rules:
  - apiGroups: [orchestrator.axxit.be]
    resources: [agentruns]
    verbs: [get, list, watch, create]
  - apiGroups: [orchestrator.axxit.be]
    resources: [agentruns/status]
    verbs: [update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create]
  # For each finished run's termination message.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator
  namespace: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: orchestrator
spec:
  # One replica: the operator runs without leader election.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: orchestrator:local
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: Agent__Image
              value: agent:local
            - name: GitHub__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: orchestrator
                  key: webhook-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
    - port: 80
      targetPort: 8080
