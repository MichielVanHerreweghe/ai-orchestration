# Builds the images of a pull request's preview, tagged with its head commit. Argo CD deploys them once the pull
# request carries the preview label (deploy/argocd/previews.yaml).
name: Preview images

on: pull_request

permissions:
  contents: read
  packages: write

jobs:
  build:
    # A fork's pull request gets no preview, and its token can't push packages anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: api, context: demo/api }
          - { name: web, context: demo/web }
    steps:
      - uses: actions/checkout@v7
        with:
          # The head commit rather than the merge commit, so the tag names what was built.
          ref: ${{ github.event.pull_request.head.sha }}
      # GHCR image names must be lowercase.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
