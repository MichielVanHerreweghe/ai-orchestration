apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql
                  key: password
            - name: ConnectionStrings__Db
              value: Server=sql;Database=Notes;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=true
          ports:
            - containerPort: 8080
          # Ready once it has created its database, which waits for SQL Server.
          readinessProbe:
            httpGet:
              path: /api/notes
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
